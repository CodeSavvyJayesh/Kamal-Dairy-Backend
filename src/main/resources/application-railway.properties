# Railway profile. Activated with SPRING_PROFILES_ACTIVE=railway.
#
# Everything sensitive comes from Railway's service variables. The app refuses
# to start if one is missing, which is far safer than falling back to a default
# nobody remembers setting. See DEPLOYMENT.md for the exact list and the order
# to add them in.

# Railway injects PORT and expects the app to bind to it. Binding to anything
# else makes the deploy look healthy in the logs and dead from the internet.
server.port=${PORT:8080}

# ------------------------------------------------------------------ database
# Works with Railway's own MySQL plugin or an external host such as Aiven. The
# plugin exposes MYSQLHOST / MYSQLPORT / MYSQLDATABASE rather than a JDBC URL,
# so DEPLOYMENT.md shows how to compose DB_URL from them.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Managed MySQL plans cap total connections, and one restarting container that
# grabs twenty of them can lock out the rest. Five is plenty for this traffic.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=20000
# Hand a connection back well before the server's own idle timeout closes it,
# otherwise the first request after a quiet night fails on a dead socket.
spring.datasource.hikari.max-lifetime=280000
spring.datasource.hikari.idle-timeout=120000

# ----------------------------------------------------------------- hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# A request must not hold a database connection while it renders JSON. Every
# query that needs lazy data already runs inside its own transaction, so this
# is safe - and it is how the test suite has always run.
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------- mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Never let a hanging SMTP server hold a worker thread open.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

# ------------------------------------------------------------------ payments
razorpay.key=${RAZORPAY_KEY}
razorpay.secret=${RAZORPAY_SECRET}

# ---------------------------------------------------------------------- auth
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Comma separated. Wildcards are allowed so Vercel preview deployments work:
# https://kamaldairy.online,https://kamal-dairy.vercel.app,https://*.vercel.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

app.contact.recipient=${CONTACT_RECIPIENT:${MAIL_USERNAME}}

# ------------------------------------------------------------------ business
app.timezone=${APP_TIMEZONE:Asia/Kolkata}
app.subscription.cutoff-hour=${APP_SUBSCRIPTION_CUTOFF_HOUR:23}
# Polled rather than fired once a night on purpose: generation is idempotent
# (one row per delivery date, unique constraint), so a container that restarts
# across the cutoff still catches up on its next tick instead of skipping a day.
app.subscription.generation-cron=${APP_SUBSCRIPTION_GENERATION_CRON:0 */10 * * * *}
app.auth.code-cooldown-seconds=${APP_AUTH_CODE_COOLDOWN_SECONDS:60}

# ----------------------------------------------------------------- invoicing
app.invoice.seller-name=${INVOICE_SELLER_NAME:Kamal Dairy}
app.invoice.trade-name=${INVOICE_TRADE_NAME:Kamal Dairy}
app.invoice.gstin=${INVOICE_GSTIN:}
app.invoice.fssai=${INVOICE_FSSAI:}
app.invoice.address-line1=${INVOICE_ADDRESS_LINE1:}
app.invoice.address-line2=${INVOICE_ADDRESS_LINE2:}
app.invoice.city=${INVOICE_CITY:}
app.invoice.state=${INVOICE_STATE:}
app.invoice.pincode=${INVOICE_PINCODE:}
app.invoice.phone=${INVOICE_PHONE:}
app.invoice.email=${INVOICE_EMAIL:}
app.invoice.prefix=${INVOICE_PREFIX:KD}
app.invoice.signatory=${INVOICE_SIGNATORY:}
app.invoice.terms=${INVOICE_TERMS:}

# -------------------------------------------------------------------- errors
# Clients get a message from GlobalExceptionHandler, never a stack trace and
# never Spring's own error body.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Trust Railway's proxy headers so ClientIp sees the real caller and the
# rate limiter does not treat every request as coming from one address.
server.forward-headers-strategy=native

# Do not advertise the server in response headers.
server.error.whitelabel.enabled=false

# ------------------------------------------------------------------- logging
logging.level.root=${LOG_LEVEL_ROOT:WARN}
logging.level.com.kamaldairy=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
