spring.application.name=kamal-dairy-backend

# ---------------------------------------------------------------------------
# LOCAL CONVENIENCE: load .env.local (gitignored) automatically if it exists.
#
# This means you can just hit Run in IntelliJ - no environment variables to
# configure by hand. Real OS environment variables still win over this file,
# so Render and Docker are unaffected, and "optional:" means the app starts
# fine on servers where the file does not exist.
# ---------------------------------------------------------------------------
spring.config.import=optional:file:./.env.local[.properties]

# ---------------------------------------------------------------------------
# NO SECRET IS HARDCODED IN THIS FILE ANY MORE.
#
# Every sensitive value is read from an environment variable. If one is
# missing the application refuses to start, which is much safer than silently
# falling back to a credential that is public on GitHub.
#
# Local dev: values live in .env.local (gitignored). In IntelliJ, open
# Run > Edit Configurations > Environment variables and paste them there,
# or install the EnvFile plugin and point it at .env.local.
# ---------------------------------------------------------------------------

server.port=${SERVER_PORT:8081}

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Razorpay
razorpay.key=${RAZORPAY_KEY}
razorpay.secret=${RAZORPAY_SECRET}

# JWT - at least 32 characters. Generate with: openssl rand -base64 48
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Comma separated list of browser origins allowed to call this API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Where the contact form is delivered
app.contact.recipient=${CONTACT_RECIPIENT:${MAIL_USERNAME}}

# Do not leak stack traces to clients
server.error.include-stacktrace=never
server.error.include-message=never

# Subscriptions (all optional - defaults shown). See SUBSCRIPTIONS.md.
# Changes for a day close at the cutoff hour the evening before, in this timezone.
app.timezone=${APP_TIMEZONE:Asia/Kolkata}
app.subscription.cutoff-hour=${APP_SUBSCRIPTION_CUTOFF_HOUR:23}
app.subscription.generation-cron=${APP_SUBSCRIPTION_GENERATION_CRON:0 */10 * * * *}

# ----------------------------------------------------------------- invoicing
# Who is selling, exactly as it must appear on the invoice.
# GSTIN is the switch that matters: set it and the dairy issues a TAX INVOICE
# with CGST and SGST; leave it blank and the same order produces a BILL OF
# SUPPLY with no tax shown, which is what an unregistered seller must issue.
app.invoice.seller-name=${INVOICE_SELLER_NAME:Kamal Dairy}
app.invoice.trade-name=${INVOICE_TRADE_NAME:Kamal Dairy}
app.invoice.gstin=${INVOICE_GSTIN:}
app.invoice.fssai=${INVOICE_FSSAI:}
app.invoice.address-line1=${INVOICE_ADDRESS_LINE1:}
app.invoice.address-line2=${INVOICE_ADDRESS_LINE2:}
app.invoice.city=${INVOICE_CITY:}
app.invoice.state=${INVOICE_STATE:}
app.invoice.pincode=${INVOICE_PINCODE:}
app.invoice.phone=${INVOICE_PHONE:}
app.invoice.email=${INVOICE_EMAIL:}
# Leading segment of every invoice number: KD/2026-27/000042
app.invoice.prefix=${INVOICE_PREFIX:KD}
app.invoice.signatory=${INVOICE_SIGNATORY:}
app.invoice.terms=${INVOICE_TERMS:}
